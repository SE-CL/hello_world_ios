name: Build multi-platform app packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.0
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies and verify source
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/build/ios/iphoneos"
          ipa_file="hello_world_ios-${APP_VERSION}-${BUILD_NUMBER}-unsigned.ipa"
          rm -rf "$output_dir/Payload"
          mkdir -p "$output_dir/Payload"
          cp -R "$output_dir/Runner.app" "$output_dir/Payload/Runner.app"
          cd "$output_dir"
          ditto -c -k --sequesterRsrc --keepParent Payload "$ipa_file"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/hello_world_ios-${{ env.APP_VERSION }}-${{ github.run_number }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/hello_world_ios-${APP_VERSION}-${BUILD_NUMBER}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/hello_world_ios-${{ env.APP_VERSION }}-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies and build Windows app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release `
            --build-name="$env:APP_VERSION" `
            --build-number="$env:BUILD_NUMBER"
          $releaseDir = 'build/windows/x64/runner/Release'
          $package = "build/windows/hello_world_ios-$env:APP_VERSION-$env:BUILD_NUMBER-windows.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $package -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: build/windows/hello_world_ios-${{ env.APP_VERSION }}-${{ github.run_number }}-windows.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS package
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies and build macOS app
        run: |
          flutter pub get
          flutter build macos --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/macos/Build/Products/Release/hello_world_ios.app"
          package="build/macos/hello_world_ios-${APP_VERSION}-${BUILD_NUMBER}-macos.zip"
          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$package"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: build/macos/hello_world_ios-${{ env.APP_VERSION }}-${{ github.run_number }}-macos.zip
          if-no-files-found: error
          retention-days: 14

  build-tweak:
    name: Build Theos tweak
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos toolchain
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/bin" >> "$GITHUB_PATH"
      - name: Build plugin package
        shell: bash
        working-directory: plugin/ScreenCalculator
        run: |
          make package FINALPACKAGE=1
          mkdir -p "$GITHUB_WORKSPACE/build/plugin"
          cp packages/*.deb "$GITHUB_WORKSPACE/build/plugin/" || true
          find .theos/obj -name '*.dylib' -exec cp {} "$GITHUB_WORKSPACE/build/plugin/" \; || true
          cp -R . "$GITHUB_WORKSPACE/build/plugin/source"
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: jailbreak-plugin
          path: build/plugin
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish version
    needs: [build-ios, build-android, build-windows, build-macos, build-tweak]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}+${{ github.run_number }}
          name: Hello World ${{ env.APP_VERSION }}+${{ github.run_number }}
          body: Automated multi-platform build #${{ github.run_number }}.
          fail_on_unmatched_files: true
          files: |
            dist/ios-ipa/*.ipa
            dist/android-apk/*.apk
            dist/windows-package/*.zip
            dist/macos-package/*.zip

      - name: Email IPA attachment
        if: env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          subject: Hello World iOS ${{ env.APP_VERSION }}+${{ env.BUILD_NUMBER }}
          to: ${{ env.MAIL_TO }}
          from: ${{ env.MAIL_USERNAME }}
          body: Attached is the unsigned iOS IPA generated by GitHub Actions.
          attachments: dist/ios-ipa/*.ipa

name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS release
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      APP_VERSION: 1.0.0
      BUILD_NUMBER: ${{ github.run_number }}
      IPA_FILE: hello_world_ios-1.0.0-${{ github.run_number }}-unsigned.ipa
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/build/ios/iphoneos"
          payload_dir="$output_dir/Payload"
          ipa_path="$output_dir/$IPA_FILE"

          test -d "$output_dir/Runner.app"
          rm -rf "$payload_dir"
          mkdir -p "$payload_dir"
          cp -R "$output_dir/Runner.app" "$payload_dir/Runner.app"
          cd "$output_dir"
          ditto -c -k --sequesterRsrc --keepParent Payload "$ipa_path"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: hello_world_ios-${{ env.APP_VERSION }}-${{ github.run_number }}-unsigned-ipa
          path: build/ios/iphoneos/${{ env.IPA_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/ios/iphoneos
          gh release create "v${APP_VERSION}+${BUILD_NUMBER}" "$IPA_FILE" \
            --title "Hello World iOS ${APP_VERSION}+${BUILD_NUMBER}" \
            --notes "Automated unsigned IPA build #${BUILD_NUMBER}."

      - name: Email IPA attachment
        if: github.event_name != 'pull_request' && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          subject: Hello World iOS ${{ env.APP_VERSION }}+${{ env.BUILD_NUMBER }}
          to: ${{ env.MAIL_TO }}
          from: ${{ env.MAIL_USERNAME }}
          body: Attached is the unsigned iOS IPA generated by GitHub Actions.
          attachments: build/ios/iphoneos/${{ env.IPA_FILE }}
